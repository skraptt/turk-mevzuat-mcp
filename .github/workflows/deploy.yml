# main dalına her gönderimde veriyi derler, testleri çalıştırır ve Cloudflare'e yayımlar.
# Güncelleme iş akışı (refresh.yml) da kontrol tarihini işledikten sonra bunu çağırır.
#
# Yayımlamadan önce anlamsal arama dizini güncellenir (anlamsal.yml).
name: Yayımla

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # anlamsal.yml vektör önbelleği dalına yazar

jobs:
  dizin:
    uses: ./.github/workflows/anlamsal.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
    secrets: inherit

  deploy:
    needs: dizin
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veriyi derle ve test et
        run: npm test

      - name: Cloudflare Workers'a yayımla
        run: npx --yes wrangler@4 deploy
